# Python tooling for the tests of the fake devices in testenv (tests/ha) and of
# Mira's page (tests/ui). The service itself is Go; see go.mod. The integration
# is in its own repository, miraassist/mira.
[project]
name = "mira-ha"
version = "0.1.0"
requires-python = ">=3.14"

[dependency-groups]
test = ["pytest-homeassistant-custom-component"]

[tool.pytest.ini_options]
testpaths = ["tests/ha"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
