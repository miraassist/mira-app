configuration:
  reset_data:
    name: Reset data at next start
    description: >-
      Turn it on and restart the app: Mira then deletes its data once (memory, messages, settings from Home Assistant)
      and keeps mira.yaml with the AI model. Then add Mira in Home Assistant again, without a code, and turn the option
      off again. While it stays on, later starts do nothing more.
