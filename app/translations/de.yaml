configuration:
  reset_data:
    name: Beim nächsten Start Daten zurücksetzen
    description: >-
      Einschalten und die App neu starten: Mira löscht dann einmal ihre Daten (Gedächtnis, Nachrichten, Einstellungen
      aus Home Assistant) und behält die mira.yaml mit dem KI-Modell. Danach Mira in Home Assistant neu hinzufügen,
      ohne Code, und die Option wieder ausschalten. Solange sie an bleibt, passiert bei weiteren Starts nichts mehr.
