water_run:
  fields:
    litres:
      default: 10
      selector:
        number:
          min: 0.1
          max: 1000
          mode: box
    every:
      default: 300
      selector:
        number:
          min: 1
          max: 86400
          unit_of_measurement: s
          mode: box
    for:
      selector:
        number:
          min: 1
          max: 604800
          unit_of_measurement: s
          mode: box
water_stop:
power:
  fields:
    entity_id:
      example: sensor.fake_aquarium_leistung
      selector:
        entity:
          integration: watch_fake
    watts:
      required: true
      selector:
        number:
          min: 0
          max: 5000
          mode: box
routine:
  fields:
    entity_id:
      example: sensor.fake_aquarium_leistung
      selector:
        entity:
          integration: watch_fake
    windows:
      required: true
      example: "07:40-11:40, 14:20-21:00"
      selector:
        text:
    watts:
      default: 50
      selector:
        number:
          min: 0
          max: 5000
          mode: box
past:
  fields:
    entity_id:
      example: sensor.fake_aquarium_leistung
      selector:
        entity:
          integration: watch_fake
    cycle:
      example: "20:40"
      selector:
        text:
    peak_every:
      default: 0
      selector:
        number:
          min: 0
          max: 720
          unit_of_measurement: h
          mode: box
    peak:
      default: 2000
      selector:
        number:
          min: 0
          max: 5000
          mode: box
    windows:
      example: "07:40-11:40, 14:20-21:00"
      selector:
        text:
    watts:
      default: 50
      selector:
        number:
          min: 0
          max: 5000
          mode: box
    days:
      default: 10
      selector:
        number:
          min: 1
          max: 30
          mode: box
    stats_days:
      default: 90
      selector:
        number:
          min: 1
          max: 365
          mode: box
cycle:
  fields:
    entity_id:
      example: sensor.fake_kuhlschrank_leistung
      selector:
        entity:
          integration: watch_fake
    watts:
      default: 45
      selector:
        number:
          min: 0
          max: 5000
          mode: box
    "on":
      required: true
      selector:
        number:
          min: 1
          max: 86400
          unit_of_measurement: s
          mode: box
    "off":
      required: true
      selector:
        number:
          min: 1
          max: 86400
          unit_of_measurement: s
          mode: box
program:
  fields:
    entity_id:
      example: sensor.fake_spulmaschine_leistung
      selector:
        entity:
          integration: watch_fake
    steps:
      required: true
      example: "600:80, 1200:2000, 300:0, 1800:80"
      selector:
        text:
washer_start:
  fields:
    steps:
      default: "300:150, 1200:2000, 1500:150, 600:500"
      example: "300:150, 1200:2000, 1500:150, 600:500"
      selector:
        text:
washer_past:
  fields:
    steps:
      default: "300:150, 1200:2000, 1500:150, 600:500"
      selector:
        text:
    hours_ago:
      default: 3
      selector:
        number:
          min: 0.5
          max: 216
          unit_of_measurement: h
          mode: box
washer_load:
  fields:
    steps:
      default: "300:150, 1200:2000, 1500:150, 600:500"
      example: "300:150, 1200:2000, 1500:150, 600:500"
      selector:
        text:
set:
  fields:
    entity_id:
      required: true
      example: binary_sensor.fake_fenster_wohnzimmer
      selector:
        entity:
          integration: watch_fake
    state:
      required: true
      example: "on"
      selector:
        text:
reachable:
  fields:
    device:
      required: true
      example: Fake Steckdose Garage
      selector:
        text:
    reachable:
      required: true
      selector:
        boolean:
add_number_named_device:
  name: Add the device named by a number
  description: Registers the device whose name is the number 4714 (docs/spec/parsing.md). Home Assistant's device page fails on it; remove it after the test.
remove_number_named_device:
  name: Remove the device named by a number
  description: Removes the device whose name is the number 4714.
