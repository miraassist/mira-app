    device_id:
      required: true
      selector:
        device:
          integration: home_connect
    b_s_h_common_option_start_in_relative:
      selector:
        number:
          min: 0
          max: 86340
          unit_of_measurement: s
          mode: box
    b_s_h_common_option_finish_in_relative:
      selector:
        number:
          min: 0
          max: 86340
          unit_of_measurement: s
          mode: box
